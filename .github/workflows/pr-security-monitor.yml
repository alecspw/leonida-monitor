name: Leonida PR Security Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (GitHub Actions minimum)
  workflow_dispatch:
    inputs:
      since_pr:
        description: 'Only check PRs after this number'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout leonida-reviews (for schema/validation)
        uses: actions/checkout@v4
        with:
          repository: Etoile-Bleu/leonida-reviews
          path: leonida-reviews

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update && sudo apt install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token

      - name: Download monitor script
        run: |
          curl -fsSL -o monitor.py https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/monitor.py

      - name: Run Security Monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python monitor.py --once --limit 100 --since-pr ${{ github.event.inputs.since_pr || '8500' }}

      - name: Push reviews to leonida-reviews repo
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd leonida-reviews
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Copy new reviews from monitor output
          cp -r ../reviews/* reviews/ 2>/dev/null || true
          
          # Check if there are new/changed reviews
          if git diff --quiet && git diff --cached --quiet; then
            echo "No new reviews to commit"
          else
            git add reviews/
            git commit -m "chore: add security reviews from $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed reviews to leonida-reviews"
          fi
          
          # Rebuild TABLE.md
          python -I build_table.py --check
          git add TABLE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update TABLE.md $(date -u +%Y-%m-%d)"
            git push
            echo "Updated TABLE.md"
          fi

      - name: Comment on analyzed PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Find PRs with findings and comment on them
          for review_file in ../reviews/*.json; do
            [ -f "$review_file" ] || continue
            
            pr_num=$(jq -r '.pr' "$review_file")
            verdict=$(jq -r '.verdict' "$review_file")
            findings=$(jq -r '.findings | join("\n")' "$review_file")
            head_sha=$(jq -r '.head_sha' "$review_file")
            
            [ "$pr_num" = "null" ] && continue
            
            # Create comment body
            if [ "$verdict" = "do-not-merge" ]; then
              emoji="🚨"
              status="**DO NOT MERGE**"
            elif [ "$verdict" = "notes" ]; then
              emoji="⚠️"
              status="**NOTES**"
            elif [ "$verdict" = "clean" ]; then
              emoji="✅"
              status="**CLEAN**"
            else
              emoji="ℹ️"
              status="$verdict"
            fi
            
            comment_body="${emoji} **Security Review: $status** (commit \`${head_sha:0:8}\`)

<details>
<summary>Findings</summary>

$(echo "$findings" | sed 's/^/- /' || echo "None")

</details>

_Scope: static analysis, diff only, nothing executed_
_Findings come from automated security review of this PR's diff; read by the account owner._"
            
            # Post comment
            gh api repos/ItsNotRexed/Leonida/issues/$pr_num/comments \
              -f body="$comment_body" \
              -H "Accept: application/vnd.github+json" 2>/dev/null || echo "Failed to comment on PR #$pr_num"
          done
