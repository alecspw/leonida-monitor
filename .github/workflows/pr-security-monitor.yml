name: Leonida PR Security Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since_pr:
        description: 'Only check PRs after this number'
        required: false
        type: string
      correct_known_false_positives:
        description: 'Correct two known false-positive review summaries on Leonida'
        required: false
        type: boolean
        default: false
      batch_ranges:
        description: 'Historical PR ranges to seed, e.g. 1000-3000,3001-6999,7000-9000'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: leonida-pr-security-monitor
  cancel-in-progress: false

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
      - name: Checkout review repository
        uses: actions/checkout@v4
        with:
          repository: Etoile-Bleu/leonida-reviews
          ref: main
          path: leonida-reviews
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test monitor
        run: |
          python -m py_compile monitor.py
          python -m unittest discover -s tests -v
      - name: Post corrections for known false-positive review summaries
        if: ${{ inputs.correct_known_false_positives }}
        working-directory: leonida-reviews
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess

          corrections = [
              (
                  9338,
                  "leonida-monitor-correction:9338:shader-terminology",
                  "**Correction — false positive**\n\nPlease disregard the previous automated note. It was triggered solely by the word shader in a descriptive comment about D3D12 texture-state masks. That is ordinary graphics terminology, not a security indicator. This finding did not identify suspicious behavior. The keyword-only terminology rule has been removed from the monitor.",
                  "False positive: ordinary graphics terminology in an explanatory comment; the keyword-only terminology rule was removed."
              ),
              (
                  9345,
                  "leonida-monitor-correction:9345:re-compile",
                  "**Correction — false positive**\n\nPlease disregard the previous automated Dynamic code execution note. The match was Python's re.compile(...), which compiles a regular expression and does not execute dynamic code. The detector now avoids qualified method calls such as .compile(), and a regression test covers this case.",
                  "False positive: Python re.compile() was mistaken for dynamic code execution; the detector was narrowed and a regression test added."
              ),
              (
                  9403,
                  "leonida-monitor-correction:9403:todo-identifier",
                  "**Correction — false positive**\n\nPlease disregard the previous automated Unfinished-work marker note. The rule matched the ordinary variable name todo in make_game.py (todo = [], todo.append(entry), and write_index(todo)). This is normal source code, not an unfinished-work marker or a security issue. The ambiguous keyword-only TODO/FIXME/HACK rule has been removed from the monitor.",
                  "False positive: ordinary todo variable was mistaken for an unfinished-work marker; ambiguous keyword-only matching was removed."
              ),
          ]

          for number, marker, body, note in corrections:
              matches = list(pathlib.Path("reviews").glob(f"*/{number}.json"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one verdict-folder record for PR #{number}, found {len(matches)}")
              path = matches[0]
              record = json.loads(path.read_text(encoding="utf-8"))
              if record.get("source") != "leonida-security-monitor":
                  raise SystemExit(f"Refusing to edit non-monitor record for PR #{number}")

              existing = subprocess.run(
                  ["gh", "api", "--paginate", f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews"],
                  capture_output=True, text=True
              )
              if existing.returncode:
                  raise SystemExit(f"Could not check correction marker for PR #{number}: {(existing.stderr or existing.stdout).strip()}")
              reviews = json.loads(existing.stdout)
              already_posted = any(marker in (item.get("body") or "") for item in reviews)

              if not already_posted:
                  payload = json.dumps({"event": "COMMENT", "body": body + "\n\n<!-- " + marker + " -->"})
                  posted = subprocess.run(
                      ["gh", "api", "--method", "POST",
                       f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews", "--input", "-"],
                      input=payload, capture_output=True, text=True
                  )
                  if posted.returncode:
                      raise SystemExit(f"Could not post correction for PR #{number}: {(posted.stderr or posted.stdout).strip()}")

              record["findings"] = []
              record["detailed_findings"] = []
              record["false_positive_corrected"] = True
              record["correction_note"] = note
              path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
              print(f"Correction confirmed for PR #{number}; false-positive finding retracted from the ledger.")
          PY
      - name: Reset legacy state for reviews that were never published
        working-directory: leonida-reviews
        run: |
          python - <<'PY'
          import json, pathlib
          state_path = pathlib.Path("monitor_state.json")
          reviews_dir = pathlib.Path("reviews")
          if not state_path.exists():
              raise SystemExit(0)
          raw_state = state_path.read_text()
          try:
              state = json.loads(raw_state)
          except json.JSONDecodeError:
              repaired = raw_state.rstrip()
              removed = 0
              while repaired.endswith("\\n"):
                  repaired = repaired[:-2]
                  removed += 1
              if not removed:
                  raise
              state = json.loads(repaired)
              print(f"Recovered monitor_state.json by removing {removed} literal \\\\n suffix(es).")
          reviewed = state.setdefault("reviewed", {})
          reset = []
          for key in list(reviewed):
              try:
                  number = int(key.split(":", 1)[0])
              except (ValueError, IndexError):
                  continue
              matches = list(reviews_dir.glob(f"*/{number}.json"))
              flat = reviews_dir / f"{number}.json"
              if flat.exists():
                  matches.append(flat)
              if not matches:
                  if reviewed[key].get("verdict") == "scan-only":
                      continue
                  reviewed.pop(key, None)
                  reset.append(number)
                  continue
              path = matches[0]
              try:
                  review = json.loads(path.read_text())
              except Exception:
                  reviewed.pop(key, None)
                  reset.append(number)
                  continue
              if review.get("verdict") == "scan-only":
                  continue
              if review.get("source") == "leonida-security-monitor" and (
                  review.get("verdict") in ("notes", "do-not-merge")
                  and (review.get("commented_on_github") is not True or review.get("publication_status") != "published")
              ):
                  path.unlink()
                  reviewed.pop(key, None)
                  reset.append(number)
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          print("Reset stale/unpublished automated review state:", sorted(set(reset)))
          PY
      - name: Run security monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MONITOR_STATE_FILE: ${{ github.workspace }}/leonida-reviews/monitor_state.json
          MONITOR_REVIEWS_DIR: ${{ github.workspace }}/reviews
          MONITOR_LEDGER_REVIEWS_DIR: ${{ github.workspace }}/leonida-reviews/reviews
          MONITOR_BATCH_QUEUE_FILE: ${{ github.workspace }}/leonida-reviews/historical_pr_batches.json
          MONITOR_REVIEW_INDEX_FILE: ${{ github.workspace }}/leonida-reviews/docs/reviews.json
          MONITOR_BATCH_REPORT_FILE: ${{ github.workspace }}/historical_batch_findings.json
          MONITOR_BATCH_RESULTS_DIR: ${{ github.workspace }}/historical-scan-output
          MONITOR_SITE_STATUS_FILE: ${{ github.workspace }}/monitor-status.json
          MONITOR_SITE_STATUS_BRANCH: monitor-status
          SINCE_PR: ${{ inputs.since_pr || '8500' }}
          BATCH_RANGES: ${{ inputs.batch_ranges || '' }}
        run: python monitor.py --once --limit 25 --since-pr "$SINCE_PR" --seed-ranges "$BATCH_RANGES" --batch-limit 100
      - name: Upload historical scan findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leonida-historical-scan-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/historical_batch_findings.json
            ${{ github.workspace }}/historical-scan-output/
          if-no-files-found: ignore
          retention-days: 30
      - name: Post a GitHub COMMENT for notes and do-not-merge findings
        working-directory: leonida-reviews
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MONITOR_REVIEWS_DIR: ${{ github.workspace }}/reviews
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, time

          monitor_dir = pathlib.Path(os.environ["MONITOR_REVIEWS_DIR"])
          queue_path = monitor_dir / "comment_queue.json"
          if not queue_path.exists():
              print("No PR comment queued.")
              raise SystemExit(0)
          queued = json.loads(queue_path.read_text()).get("prs", [])
          if not queued:
              print("No PR comment queued.")
              raise SystemExit(0)

          number = int(queued[0])
          source = monitor_dir / f"{number}.json"
          if not source.exists():
              raise SystemExit(f"Queued PR #{number} has no analysis JSON.")
          review = json.loads(source.read_text())
          if review.get("verdict") not in ("clean", "notes", "do-not-merge"):
              raise SystemExit(f"Refusing to comment on unsupported verdict: {review.get('verdict')}")

          # Avoid publishing another copy if a previous request succeeded but the runner lost its response.
          marker = f"<!-- leonida-monitor:{number}:{review['head_sha']} -->"
          actor_result = subprocess.run(["gh", "api", "user", "--jq", ".login"], capture_output=True, text=True)
          if actor_result.returncode:
              raise SystemExit("Unable to identify the GitHub reviewer: " + actor_result.stderr.strip())
          actor = actor_result.stdout.strip()

          existing = subprocess.run(
              ["gh", "api", "--paginate", f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews",
               "--jq", f'.[] | select(.commit_id == "{review["head_sha"]}" and (.body // "" | contains("{marker}"))) | .id'],
              capture_output=True, text=True)
          if existing.returncode:
              print("Could not check existing reviews; leaving PR queued for a later run: " + existing.stderr.strip())
              raise SystemExit(0)

          posted = bool(existing.stdout.strip())
          if not posted:
              details = []
              for item in review.get("detailed_findings", [])[:12]:
                  severity = str(item.get("severity", "unknown")).upper()
                  label = str(item.get("pattern", "Finding"))
                  file = str(item.get("file") or "PR metadata")
                  line = item.get("line", 0)
                  evidence = str(item.get("match", "No excerpt available"))[:180]
                  # Never echo a suspected credential/token literal into a public comment.
                  if "secret" in label.lower() or "credential" in label.lower() or "password" in label.lower() or "token" in label.lower():
                      evidence = "[evidence redacted; inspect the added line privately]"
                  related = f" (related PR #{item['related_pr']})" if item.get("related_pr") else ""
                  details.append(f"- **{severity} — {label}** at `{file}:{line}`{related}\n  Evidence: `{evidence}`")

              if review["verdict"] == "clean":
                  intro = "No configured security heuristics were triggered in the added diff. This is a clean heuristic scan, not a guarantee that the change is safe."
              elif review["verdict"] == "do-not-merge":
                  intro = "The static monitor detected high-severity suspicious-code indicators. Please investigate before merging; this is a heuristic alert, not a confirmed vulnerability."
              else:
                  intro = "The static monitor found items that need maintainer inspection. These are heuristic signals, not confirmed vulnerabilities."

              result_label = {"clean": "CLEAN", "notes": "REVIEW REQUIRED", "do-not-merge": "DO NOT MERGE"}[review["verdict"]]
              findings_text = "\n".join(details) if details else "- No findings detected by the configured rules."
              body = (
                  "## Automated security scan\n\n"
                  + f"**Result:** {result_label}\n"
                  + f"**PR:** [#{number} — {review.get('pr_title', '')}]({review.get('pr_url', '')})\n\n"
                  + intro + "\n\n### Findings\n\n"
                  + findings_text
                  + f"\n\n---\n_Diff-only heuristic scan. Contributor code was not executed. Advisory only; does not replace maintainer review._\n\n{marker}"
              )
              payload = json.dumps({"event": "COMMENT", "body": body})
              submitted = False
              for attempt, delay in enumerate((0, 60, 120), start=1):
                  if delay:
                      print(f"Secondary rate limit retry {attempt}/3; waiting {delay}s.", flush=True)
                      time.sleep(delay)
                  result = subprocess.run(
                      ["gh", "api", "--method", "POST",
                       f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews", "--input", "-"],
                      input=payload, capture_output=True, text=True)
                  if result.returncode == 0:
                      submitted = True
                      posted = True
                      break
                  error = (result.stderr or result.stdout).strip()
                  low = error.lower()
                  if any(term in low for term in ("secondary rate limit", "abuse detection", "api rate limit exceeded", "http 429", "http 403")):
                      print(f"GitHub rate-limited PR #{number} comment attempt {attempt}/3: {error}", flush=True)
                      continue
                  raise SystemExit(f"GitHub rejected PR #{number} comment: {error}")
              if not submitted:
                  print(f"PR #{number} remains pending; the next scheduled workflow will retry it.")
                  raise SystemExit(0)

          # Only now publish the record: GitHub confirmed the comment, or the marker proves it already exists.
          review["review_submitted"] = True
          review["commented_on_github"] = True
          review["github_review_event"] = "COMMENT"
          review["publication_status"] = "published"
          review["public_disclosure_reviewed"] = True
          dest = pathlib.Path("reviews") / review["verdict"] / f"{number}.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          existing_paths = list(pathlib.Path("reviews").glob(f"*/{number}.json"))
          flat = pathlib.Path("reviews") / f"{number}.json"
          if flat.exists():
              existing_paths.append(flat)
          for old_path in existing_paths:
              if old_path == dest:
                  continue
              previous = json.loads(old_path.read_text())
              if previous.get("source") != "leonida-security-monitor":
                  print(f"PR #{number} already has a non-monitor review at {old_path}; preserving it.")
                  raise SystemExit(0)
              old_path.unlink()
          if dest.exists():
              previous = json.loads(dest.read_text())
              if previous.get("source") != "leonida-security-monitor":
                  print(f"PR #{number} already has a non-monitor public review; preserving it.")
                  raise SystemExit(0)
          dest.write_text(json.dumps(review, indent=2) + "\n")

          state_path = pathlib.Path("monitor_state.json")
          state = json.loads(state_path.read_text()) if state_path.exists() else {"reviewed": {}, "pending": []}
          state.setdefault("reviewed", {})
          state["pending"] = [
              item for item in state.get("pending", [])
              if not (int(item.get("pr", -1)) == number and item.get("head_sha") == review["head_sha"])
          ]
          state["reviewed"][f"{number}:{review['head_sha']}"] = {
              "verdict": review["verdict"], "at": review.get("created_at"), "commented": True
          }
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          print(f"GitHub COMMENT confirmed for PR #{number}; review marked publishable.")
          PY
      - name: Remove legacy unpublished automated records
        working-directory: leonida-reviews
        run: |
          python - <<'PY'
          import json, pathlib
          removed = []
          for path in pathlib.Path("reviews").glob("*/*.json"):
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  continue
              if data.get("source") == "leonida-security-monitor" and (
                  data.get("verdict") in ("notes", "do-not-merge")
                  and (data.get("commented_on_github") is not True or data.get("publication_status") != "published")
              ):
                  path.unlink()
                  removed.append(path.name)
          print("Removed unpublished legacy monitor records:", removed)
          PY
      - name: Commit scan records and checkpoint
        working-directory: leonida-reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reviews/ monitor_state.json historical_pr_batches.json
          if git diff --cached --quiet; then
            echo "No scan records or checkpoint changes."
            exit 0
          fi

          git commit -m "chore: save historical PR scan checkpoint"
          pushed=false
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Concurrent ledger update; rebasing only the scan records and checkpoint (attempt $attempt/4)."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Conflict in scan records/checkpoint; aborting without auto-merging."
              git rebase --abort || true
              exit 1
            fi
          done
          if [ "$pushed" != true ]; then
            echo "Could not publish scan checkpoint after 4 non-force push attempts."
            exit 1
          fi
          echo "Scan records and checkpoint published. table.yml will regenerate the public index."
