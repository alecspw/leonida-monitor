name: Leonida PR Security Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since_pr:
        description: 'Only check PRs after this number'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: leonida-pr-security-monitor
  cancel-in-progress: false

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
      - name: Checkout review repository
        uses: actions/checkout@v4
        with:
          repository: Etoile-Bleu/leonida-reviews
          ref: main
          path: leonida-reviews
          token: \${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test monitor
        run: |
          python -m py_compile monitor.py
          python -m unittest discover -s tests -v
      - name: Run security monitor
        env:
          GH_TOKEN: \${{ secrets.GH_TOKEN }}
          MONITOR_STATE_FILE: \${{ github.workspace }}/leonida-reviews/monitor_state.json
          MONITOR_REVIEWS_DIR: \${{ github.workspace }}/reviews
          SINCE_PR: \${{ inputs.since_pr || '8500' }}
        run: python monitor.py --once --limit 25 --since-pr "$SINCE_PR"
      - name: Copy reviews and regenerate index
        run: |
          mkdir -p leonida-reviews/reviews
          if compgen -G 'reviews/*.json' > /dev/null; then cp -f reviews/*.json leonida-reviews/reviews/; fi
          if [ -f reviews/comment_queue.json ]; then mv reviews/comment_queue.json leonida-reviews/comment_queue.json; fi
          cd leonida-reviews
          python -I build_table.py
          python -I build_table.py --check
      - name: Submit GitHub PR reviews (approve / request changes / comment)
        working-directory: leonida-reviews
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, time
          q = pathlib.Path("comment_queue.json")
          if not q.exists():
              print("No new PR review queue.")
              raise SystemExit(0)
          actor = subprocess.run(["gh", "api", "user", "--jq", ".login"], capture_output=True, text=True, check=True).stdout.strip().lower()
          for number in json.loads(q.read_text()).get("prs", [])[:2]:
              path = pathlib.Path(f"reviews/{number}.json")
              if not path.exists(): continue
              review = json.loads(path.read_text())
              if review.get("review_submitted"): continue
              verdict = review.get("verdict", "notes")
              author = str(review.get("author", "")).lower()
              if verdict == "clean":
                  event = "APPROVE"
                  intro = "Automated static review found no configured security indicators in the added diff lines. This is not a guarantee of safety."
              elif verdict == "do-not-merge":
                  event = "REQUEST_CHANGES"
                  intro = "Changes requested: high-severity suspicious-code indicators were detected. Do not merge until a maintainer investigates and resolves or explicitly clears them."
              else:
                  event = "COMMENT"
                  intro = "Review note: the monitor found items that need human inspection, but did not find a high-severity indicator requiring a changes request."
              if author and author == actor and event in ("APPROVE", "REQUEST_CHANGES"):
                  print(f"PR #{number}: authenticated reviewer is the PR author; GitHub will not accept an approval/request from the author. Posting COMMENT instead.")
                  event = "COMMENT"
              details = []
              for item in review.get("detailed_findings", [])[:15]:
                  location = f"`{item.get('file')}`:{item.get('line')}" if item.get("file") else "PR metadata"
                  related = f" (related PR: #{item['related_pr']})" if item.get("related_pr") else ""
                  details.append(f"- **{item.get('severity','unknown').upper()} — {item.get('pattern','Finding')}** at {location}{related}\n  Evidence: {item.get('match','No excerpt available')[:350]}")
              body = ("**Leonida automated review — " + event + "**\n\n" + intro + "\n\n**Findings and reasons**\n"
                      + ("\n".join(details) if details else "- No configured indicators matched the added diff lines.")
                      + "\n\n_Static heuristic analysis only; contributor code was not executed. This review is advisory and does not replace maintainer review._")
              payload = json.dumps({"event": event, "body": body})
              p = subprocess.run(["gh", "api", "--method", "POST", f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews", "--input", "-"], input=payload, capture_output=True, text=True)
              if p.returncode:
                  msg = (p.stderr or p.stdout).strip()
                  print(f"PR review submission failed for #{number}: {msg}")
                  if "403" in msg or "429" in msg or "rate limit" in msg.lower():
                      print("Rate limit or permission issue; stopping review queue."); break
                  continue
              review["review_submitted"] = True
              review["github_review_event"] = event
              path.write_text(json.dumps(review, indent=2) + "\n")
              print(f"Submitted {event} review for PR #{number}")
              time.sleep(3)
          PY
      - name: Commit reviews, state, and generated table
        working-directory: leonida-reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/ TABLE.md monitor_state.json
          if git diff --cached --quiet; then echo "No review repository changes to commit"
          else git commit -m "chore: update automated PR security reviews" && git push origin HEAD:main
          fi
