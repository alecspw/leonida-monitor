name: Leonida PR Security Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since_pr:
        description: 'Only check PRs after this number'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: leonida-pr-security-monitor
  cancel-in-progress: false

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
      - name: Checkout review repository
        uses: actions/checkout@v4
        with:
          repository: Etoile-Bleu/leonida-reviews
          ref: main
          path: leonida-reviews
          token: \${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test monitor
        run: |
          python -m py_compile monitor.py
          python -m unittest discover -s tests -v
      - name: Run security monitor
        env:
          GH_TOKEN: \${{ secrets.GH_TOKEN }}
          MONITOR_STATE_FILE: \${{ github.workspace }}/leonida-reviews/monitor_state.json
          MONITOR_REVIEWS_DIR: \${{ github.workspace }}/reviews
          SINCE_PR: \${{ inputs.since_pr || '8500' }}
        run: python monitor.py --once --limit 25 --since-pr "$SINCE_PR"
      - name: Copy reviews and regenerate index
        run: |
          mkdir -p leonida-reviews/reviews
          if compgen -G 'reviews/*.json' > /dev/null; then cp -f reviews/*.json leonida-reviews/reviews/; fi
          if [ -f reviews/comment_queue.json ]; then mv reviews/comment_queue.json leonida-reviews/comment_queue.json; fi
          cd leonida-reviews
          python -I build_table.py
          python -I build_table.py --check
      - name: Comment on newly flagged PRs (strictly paced)
        working-directory: leonida-reviews
        env:
          GH_TOKEN: \${{ secrets.GH_TOKEN }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, time
          q = pathlib.Path("comment_queue.json")
          if not q.exists():
              print("No new comment queue.")
              raise SystemExit(0)
          for number in json.loads(q.read_text()).get("prs", [])[:2]:
              path = pathlib.Path(f"reviews/{number}.json")
              if not path.exists(): continue
              review = json.loads(path.read_text())
              if review.get("commented_on_github"): continue
              findings = review.get("detailed_findings", [])
              verdict = review.get("verdict", "notes").upper()
              if verdict == "DO-NOT-MERGE":
                  intro = ("**Why this PR is marked DO-NOT-MERGE:** one or more high-severity indicators "
                           "matched newly added code. These indicators are suspicious behaviors, not a claim "
                           "that malware was executed or conclusively proven.")
              else:
                  intro = "**Why this PR was flagged:** the monitor found review-worthy security, duplication, or quality indicators."
              details = []
              for item in findings[:15]:
                  location = (f"`{item.get('file')}`:{item.get('line')}" if item.get('file') else "PR metadata")
                  related = f" (related PR: #{item['related_pr']})" if item.get("related_pr") else ""
                  details.append("- **" + item.get("severity", "unknown").upper() + " — " + item.get("pattern", "Finding") + "** at " + location + related + "\n"
                                 + "  Reason/evidence: " + item.get("match", "No excerpt available")[:350])
              body = ("🚨 **Leonida security monitor — " + verdict + "**\n\n" + intro + "\n\n"
                      + "**Findings and reasons**\n" + ("\n".join(details) if details else "- No detailed findings recorded.")
                      + "\n\n**Recommended action:** do not merge until a maintainer has inspected each finding and confirmed it is safe or a false positive."
                      + "\n\n_Automated heuristic static analysis only; contributor code was not executed. This is a review recommendation, not a malware verdict or an enforced merge block._")
              p = subprocess.run(["gh","api","--method","POST",f"repos/ItsNotRexed/Leonida/issues/{number}/comments","-f",f"body={body}"],capture_output=True,text=True)
              if p.returncode:
                  msg=(p.stderr or p.stdout).strip()
                  print(f"Comment failed for PR #{number}: {msg}")
                  if "403" in msg or "429" in msg or "rate limit" in msg.lower():
                      print("Rate limit detected; stopping comment queue."); break
                  continue
              review["commented_on_github"]=True
              path.write_text(json.dumps(review,indent=2)+"\n")
              print(f"Commented on PR #{number}")
              time.sleep(3)
          PY
      - name: Commit reviews, state, and generated table
        working-directory: leonida-reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/ TABLE.md monitor_state.json
          if git diff --cached --quiet; then echo "No review repository changes to commit"
          else git commit -m "chore: update automated PR security reviews" && git push origin HEAD:main
          fi
