name: Leonida PR Security Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since_pr:
        description: 'Only check PRs after this number'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: leonida-pr-security-monitor
  cancel-in-progress: false

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
      - name: Checkout review repository
        uses: actions/checkout@v4
        with:
          repository: Etoile-Bleu/leonida-reviews
          ref: main
          path: leonida-reviews
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test monitor
        run: |
          python -m py_compile monitor.py
          python -m unittest discover -s tests -v
      - name: Reset legacy state for reviews that were never published
        working-directory: leonida-reviews
        run: |
          python - <<'PY'
          import json, pathlib
          state_path = pathlib.Path("monitor_state.json")
          reviews_dir = pathlib.Path("reviews")
          if not state_path.exists():
              raise SystemExit(0)
          state = json.loads(state_path.read_text())
          reviewed = state.setdefault("reviewed", {})
          reset = []
          for key in list(reviewed):
              try:
                  number = int(key.split(":", 1)[0])
              except (ValueError, IndexError):
                  continue
              path = reviews_dir / f"{number}.json"
              if not path.exists():
                  reviewed.pop(key, None)
                  reset.append(number)
                  continue
              try:
                  review = json.loads(path.read_text())
              except Exception:
                  reviewed.pop(key, None)
                  reset.append(number)
                  continue
              if review.get("source") == "leonida-security-monitor" and (
                  review.get("commented_on_github") is not True or review.get("publication_status") != "published"
              ):
                  path.unlink()
                  reviewed.pop(key, None)
                  reset.append(number)
          state_path.write_text(json.dumps(state, indent=2) + "\\n")
          print("Reset stale/unpublished automated review state:", sorted(set(reset)))
          PY
      - name: Run security monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MONITOR_STATE_FILE: ${{ github.workspace }}/leonida-reviews/monitor_state.json
          MONITOR_REVIEWS_DIR: ${{ github.workspace }}/reviews
          SINCE_PR: ${{ inputs.since_pr || '8500' }}
        run: python monitor.py --once --limit 25 --since-pr "$SINCE_PR"
      - name: Post a GitHub COMMENT for notes and do-not-merge findings
        working-directory: leonida-reviews
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MONITOR_REVIEWS_DIR: ${{ github.workspace }}/reviews
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, time

          monitor_dir = pathlib.Path(os.environ["MONITOR_REVIEWS_DIR"])
          queue_path = monitor_dir / "comment_queue.json"
          if not queue_path.exists():
              print("No PR comment queued.")
              raise SystemExit(0)
          queued = json.loads(queue_path.read_text()).get("prs", [])
          if not queued:
              print("No finding-bearing PRs to comment on; clean scans are never approved.")
              raise SystemExit(0)

          number = int(queued[0])
          source = monitor_dir / f"{number}.json"
          if not source.exists():
              raise SystemExit(f"Queued PR #{number} has no analysis JSON.")
          review = json.loads(source.read_text())
          if review.get("verdict") not in ("notes", "do-not-merge"):
              raise SystemExit(f"Refusing to comment on unsupported verdict: {review.get('verdict')}")

          # Avoid publishing another copy if a previous request succeeded but the runner lost its response.
          marker = f"<!-- leonida-monitor:{number}:{review['head_sha']} -->"
          actor_result = subprocess.run(["gh", "api", "user", "--jq", ".login"], capture_output=True, text=True)
          if actor_result.returncode:
              raise SystemExit("Unable to identify the GitHub reviewer: " + actor_result.stderr.strip())
          actor = actor_result.stdout.strip()

          existing = subprocess.run(
              ["gh", "api", "--paginate", f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews",
               "--jq", f'.[] | select(.commit_id == "{review["head_sha"]}" and (.body // "" | contains("{marker}"))) | .id'],
              capture_output=True, text=True)
          if existing.returncode:
              print("Could not check existing reviews; leaving PR queued for a later run: " + existing.stderr.strip())
              raise SystemExit(0)

          posted = bool(existing.stdout.strip())
          if not posted:
              details = []
              for item in review.get("detailed_findings", [])[:12]:
                  severity = str(item.get("severity", "unknown")).upper()
                  label = str(item.get("pattern", "Finding"))
                  file = str(item.get("file") or "PR metadata")
                  line = item.get("line", 0)
                  evidence = str(item.get("match", "No excerpt available"))[:180]
                  # Never echo a suspected credential/token literal into a public comment.
                  if "secret" in label.lower() or "credential" in label.lower() or "password" in label.lower() or "token" in label.lower():
                      evidence = "[evidence redacted; inspect the added line privately]"
                  related = f" (related PR #{item['related_pr']})" if item.get("related_pr") else ""
                  details.append(f"- **{severity} — {label}** at `{file}:{line}`{related}\n  Evidence: `{evidence}`")

              if review["verdict"] == "do-not-merge":
                  intro = "The static monitor detected one or more high-severity suspicious-code indicators. Please investigate before merging; this is a heuristic alert, not a confirmed vulnerability."
              else:
                  intro = "The static monitor found items that need maintainer inspection. These are heuristic signals, not confirmed vulnerabilities."

              body = (
                  "**Leonida automated security-monitor note**\n\n"
                  + intro + "\n\n**Findings**\n"
                  + ("\n".join(details) if details else "- No detailed evidence was recorded.")
                  + f"\n\n_Diff-only heuristic scan; contributor code was not executed. This is advisory and does not replace maintainer review._\n\n{marker}"
              )
              payload = json.dumps({"event": "COMMENT", "body": body})
              submitted = False
              for attempt, delay in enumerate((0, 60, 120), start=1):
                  if delay:
                      print(f"Secondary rate limit retry {attempt}/3; waiting {delay}s.", flush=True)
                      time.sleep(delay)
                  result = subprocess.run(
                      ["gh", "api", "--method", "POST",
                       f"repos/ItsNotRexed/Leonida/pulls/{number}/reviews", "--input", "-"],
                      input=payload, capture_output=True, text=True)
                  if result.returncode == 0:
                      submitted = True
                      posted = True
                      break
                  error = (result.stderr or result.stdout).strip()
                  low = error.lower()
                  if any(term in low for term in ("secondary rate limit", "abuse detection", "api rate limit exceeded", "http 429", "http 403")):
                      print(f"GitHub rate-limited PR #{number} comment attempt {attempt}/3: {error}", flush=True)
                      continue
                  raise SystemExit(f"GitHub rejected PR #{number} comment: {error}")
              if not submitted:
                  print(f"PR #{number} remains pending; the next scheduled workflow will retry it.")
                  raise SystemExit(0)

          # Only now publish the record: GitHub confirmed the comment, or the marker proves it already exists.
          review["review_submitted"] = True
          review["commented_on_github"] = True
          review["github_review_event"] = "COMMENT"
          review["publication_status"] = "published"
          review["public_disclosure_reviewed"] = True
          dest = pathlib.Path(f"reviews/{number}.json")
          dest.parent.mkdir(exist_ok=True)
          # Do not overwrite a manual/human review file.
          if dest.exists():
              previous = json.loads(dest.read_text())
              if previous.get("source") != "leonida-security-monitor":
                  print(f"PR #{number} already has a non-monitor public review; preserving it.")
              else:
                  dest.write_text(json.dumps(review, indent=2) + "\n")
          else:
              dest.write_text(json.dumps(review, indent=2) + "\n")

          state_path = pathlib.Path("monitor_state.json")
          state = json.loads(state_path.read_text()) if state_path.exists() else {"reviewed": {}, "pending": []}
          state.setdefault("reviewed", {})
          state["pending"] = [
              item for item in state.get("pending", [])
              if not (int(item.get("pr", -1)) == number and item.get("head_sha") == review["head_sha"])
          ]
          state["reviewed"][f"{number}:{review['head_sha']}"] = {
              "verdict": review["verdict"], "at": review.get("created_at"), "commented": True
          }
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          print(f"GitHub COMMENT confirmed for PR #{number}; review marked publishable.")
          PY
      - name: Remove legacy unpublished automated records
        working-directory: leonida-reviews
        run: |
          python - <<'PY'
          import json, pathlib
          removed = []
          for path in pathlib.Path("reviews").glob("*.json"):
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  continue
              if data.get("source") == "leonida-security-monitor" and (
                  data.get("commented_on_github") is not True or data.get("publication_status") != "published"
              ):
                  path.unlink()
                  removed.append(path.name)
          print("Removed unpublished legacy monitor records:", removed)
          PY
      - name: Generate and validate GitHub Pages review data
        working-directory: leonida-reviews
        run: |
          python -I build_table.py
          python -I build_table.py --check
      - name: Commit published reviews and generated Pages data
        working-directory: leonida-reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reviews/ TABLE.md docs/reviews.json monitor_state.json
          if git diff --cached --quiet; then echo "No published review changes"
          else git commit -m "chore: publish confirmed automated PR comments" && git push origin HEAD:main
          fi
